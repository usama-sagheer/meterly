name: Build Native iOS App

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install Dependencies
        run: pnpm install

      - name: Build Web Assets & Sync Capacitor
        run: |
          pnpm build
          npx cap sync ios

      - name: Build Xcode Project
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Debug -sdk iphoneos -derivedDataPath build

      - name: Upload iOS App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Meterly-iOS-App
          path: ios/App/build/Build/Products/Debug-iphoneos/App.app
